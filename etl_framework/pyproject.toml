[project]
name = "etl-framework"
version = "0.1.0"
requires-python = ">=3.11"

[project.optional-dependencies]
dev = ["pytest", "pytest-cov", "requests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "smoke: быстрые проверки что API отвечает",
    "regression: детальные проверки бизнес-логики",
    "integration: тесты с реальным API DnD Shop",
]
