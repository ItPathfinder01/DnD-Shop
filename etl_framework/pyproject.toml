[project]
name = "etl-framework"
version = "0.1.0"
requires-python = ">=3.11"

[project.optional-dependencies]
dev = [
    "pytest>=9.0.0",
    "pytest-cov>=6.0.0",
    "allure-pytest>=2.16.0",
    "requests>=2.34.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "smoke: быстрые проверки что API отвечает",
    "regression: детальные проверки бизнес-логики",
    "integration: тесты с реальным API DnD Shop",
]
