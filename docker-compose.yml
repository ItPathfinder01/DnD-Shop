services:
  db:
    image: postgres:16
    container_name: dnd_shop_db
    environment:
      POSTGRES_DB: dnd_shop
      POSTGRES_USER: dnd_user
      POSTGRES_PASSWORD: dnd_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dnd_user -d dnd_shop"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    container_name: dnd_shop_backend
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://dnd_user:dnd_password@db:5432/dnd_shop
    volumes:
      - uploads_data:/app/uploads
    ports:
      - "8000:8000"
    restart: unless-stopped

  frontend:
    build: ./frontend
    container_name: dnd_shop_frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: unless-stopped

  qa_agent:
    build: ./qa_agent
    container_name: dnd_shop_qa_agent
    ports:
      - "8001:8001"
    environment:
      JIRA_BASE_URL: ${JIRA_BASE_URL}
      JIRA_EMAIL: ${JIRA_EMAIL}
      JIRA_API_TOKEN: ${JIRA_API_TOKEN}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      GITHUB_WEBHOOK_SECRET: ${GITHUB_WEBHOOK_SECRET:-}
    restart: unless-stopped

volumes:
  postgres_data:
    external: true
    name: dnd_shop_postgres_data
  uploads_data:
