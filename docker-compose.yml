services:
  db:
    image: postgres:16
    container_name: dnd_shop_db
    environment:
      POSTGRES_DB: dnd_shop
      POSTGRES_USER: dnd_user
      POSTGRES_PASSWORD: dnd_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dnd_user -d dnd_shop"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
